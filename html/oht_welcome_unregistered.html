<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - OHT Dashboard</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 56px 40px;
        max-width: 440px;
        width: 100%;
        text-align: center;
    }

    .logo {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #999999;
        margin-bottom: 32px;
    }

    .headline {
        font-size: 26px;
        font-weight: 600;
        color: #000000;
        margin-bottom: 10px;
    }

    .subtitle {
        font-size: 13px;
        color: #666666;
        line-height: 1.5;
        margin-bottom: 28px;
    }

    .email-info {
        background: #fafafa;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 28px;
    }

    .email-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #999999;
        margin-bottom: 4px;
    }

    #userEmail { font-size: 13px; color: #000000; font-weight: 600; }

    .actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }

    .btn {
        display: block;
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid #000000;
        transition: all 0.15s;
    }

    .btn-primary { background: #000000; color: #ffffff; }
    .btn-primary:hover { background: #222222; }

    .btn-secondary { background: #ffffff; color: #000000; }
    .btn-secondary:hover { background: #f5f5f5; }

    .support {
        border-top: 1px solid #e0e0e0;
        padding-top: 20px;
    }

    .support-title {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #999999;
        margin-bottom: 6px;
    }

    .support-text { font-size: 12px; color: #666666; }
    .support-link { color: #000000; font-weight: 600; text-decoration: none; }
    .support-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
    <div class="logo">OHT NYC</div>
    <div class="headline">Hello! Welcome!</div>
    <p class="subtitle">
        We don't see an account for you yet in the OHT Dashboard system.
        Once an administrator adds you, you'll be able to sign in and access your dashboard.
    </p>

    <div class="email-info">
        <div class="email-label">Signed in as</div>
        <div id="userEmail">loading...</div>
    </div>

    <div class="actions">
        <a href="mailto:hr@ohtnyc.com" class="btn btn-primary">Request Access</a>
        <button class="btn btn-secondary" onclick="loginAgain()">Sign In with Different Account</button>
    </div>

    <div class="support">
        <div class="support-title">Need Help?</div>
        <p class="support-text">
            Reach out to <a href="mailto:hr@ohtnyc.com" class="support-link">hr@ohtnyc.com</a> to get set up.
        </p>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || sessionStorage.getItem('attempted_email') || 'unknown@example.com';
        document.getElementById('userEmail').textContent = email;
    });

    function loginAgain() {
        sessionStorage.clear();
        window.location.href = 'oht_dashboard_login.html';
    }
</script>

</body>
</html>
