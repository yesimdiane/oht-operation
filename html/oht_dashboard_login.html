<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHT Operations — Login</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Helvetica Neue",
                sans-serif;

            background: #ffffff;
            color: #000000;
        }

        .login-container {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #f5f5f5 0%,
                    #ffffff 100%
                );
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            border: 1px solid #e0e0e0;
            border-radius: 8px;

            padding: 56px 40px;

            box-shadow:
                0 2px 16px rgba(0, 0, 0, 0.08);
        }

        .login-logo {
            font-size: 12px;
            font-weight: 700;

            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: #999999;

            text-align: center;

            margin-bottom: 24px;
        }

        .login-title {
            font-size: 32px;
            font-weight: 600;

            text-align: center;

            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 13px;

            line-height: 1.6;

            text-align: center;

            color: #999999;

            margin-bottom: 36px;
        }

        .login-content {
            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        .google-signin {
            display: flex;
            justify-content: center;
        }

        .login-divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin: 6px 0;
        }

        .login-divider-line {
            flex: 1;

            height: 1px;

            background: #e0e0e0;
        }

        .login-divider-text {
            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1px;
            text-transform: uppercase;

            color: #aaaaaa;
        }

        .demo-section {
            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .demo-label {
            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1px;
            text-transform: uppercase;

            color: #999999;
        }

        .demo-select {
            width: 100%;

            padding: 12px;

            border: 1px solid #d0d0d0;
            border-radius: 4px;

            background: #ffffff;

            font-family: inherit;
            font-size: 13px;

            cursor: pointer;
        }

        .demo-select:focus {
            outline: none;
            border-color: #000000;
        }

        .demo-btn {
            width: 100%;

            padding: 12px 16px;

            border: 1px solid #d0d0d0;
            border-radius: 4px;

            background: #ffffff;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .demo-btn:hover {
            border-color: #000000;
            background: #fafafa;
        }

        .demo-btn.primary {
            background: #000000;
            border-color: #000000;

            color: #ffffff;
        }

        .demo-btn.primary:hover {
            background: #222222;
        }

        .login-note {
            margin-top: 22px;

            font-size: 10px;
            line-height: 1.5;

            color: #aaaaaa;

            text-align: center;
        }

        @media (max-width: 600px) {
            .login-card {
                padding: 40px 24px;
            }

            .login-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-logo">
                OHT / INTERNAL OPS
            </div>

            <h1 class="login-title">
                Dashboard
            </h1>

            <p class="login-subtitle">
                Sign in to access your OHT operations dashboard.
            </p>


            <div class="login-content">

                <!-- GOOGLE LOGIN -->

                <div class="google-signin">

                    <div
                        id="g_id_onload"
                        data-client_id="337829766336-097j7o7h2nahieg07vc8ib1hppanr46m.apps.googleusercontent.com"
                        data-callback="handleCredentialResponse"
                        data-auto_prompt="false">
                    </div>

                    <div
                        class="g_id_signin"
                        data-type="standard"
                        data-shape="rectangular"
                        data-theme="outline"
                        data-text="signin_with"
                        data-size="large"
                        data-logo_alignment="left">
                    </div>

                </div>


                <div class="login-divider">
                    <div class="login-divider-line"></div>

                    <div class="login-divider-text">
                        Demo
                    </div>

                    <div class="login-divider-line"></div>
                </div>


                <!-- EMPLOYEE DEMO -->

                <div class="demo-section">

                    <label
                        class="demo-label"
                        for="demoDepartment">

                        Department Employee

                    </label>


                    <select
                        id="demoDepartment"
                        class="demo-select">

                        <option value="">
                            Select Department
                        </option>

                        <option value="MARKETING">
                            Marketing
                        </option>

                        <option value="CONTENT">
                            Content
                        </option>

                        <option value="SHIPPING">
                            Shipping
                        </option>

                        <option value="INVENTORY">
                            Inventory
                        </option>

                        <option value="OPERATIONS">
                            Operations
                        </option>

                        <option value="KOREA OPS">
                            Korea Ops
                        </option>

                        <option value="EXECUTIVE">
                            Executive
                        </option>

                    </select>


                    <button
                        type="button"
                        class="demo-btn"
                        onclick="loginAsDepartmentDemo()">

                        Demo Employee View →

                    </button>

                </div>


                <!-- CEO DEMO -->

                <button
                    type="button"
                    class="demo-btn primary"
                    onclick="loginAsDemoCEO()">

                    Demo CEO View →

                </button>

            </div>


            <div class="login-note">

                Access is determined by your registered email,
                title, department and team.

            </div>

        </section>

    </main>


    <!--
        IMPORTANT:
        login HTML is inside /html/
        app.js is in repository root
    -->

    <script src="../app.js"></script>

</body>
</html>
